name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      TEST_EMAIL:             ${{ secrets.TEST_EMAIL }}
      TEST_PASS:              ${{ secrets.TEST_PASS }}
      TEST_ADMIN_EMAIL:       ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASS:        ${{ secrets.TEST_ADMIN_PASS }}
      VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Only runs on pushes to main (not PRs), and only if all tests passed.
  # This replaces Vercel's automatic GitHub deploy — disable "Deploy on Push"
  # in Vercel project settings (Settings → Git) so this job is the sole
  # trigger for production deploys.
  #
  # Required GitHub secrets:
  #   VERCEL_TOKEN       — create at vercel.com/account/tokens
  #   VERCEL_ORG_ID      — run `vercel link` locally, then check .vercel/project.json
  #   VERCEL_PROJECT_ID  — same file
  deploy:
    needs: playwright
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel production
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
